[supervisord]
nodaemon=true
pidfile=/tmp/penpot/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/penpot/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/penpot/supervisor.sock

[program:postgres]
command=/usr/local/bin/penpot-postgres
priority=10
autorestart=true
startsecs=2
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopsignal=TERM

[program:redis]
command=/usr/bin/redis-server /tmp/penpot/redis.conf
priority=10
autorestart=true
startsecs=1
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopsignal=TERM

[program:mailpit]
command=/usr/local/bin/penpot-mailpit
priority=15
autorestart=true
startsecs=0
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
